name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ created ]
  # Run workflow when a new tag is created
  create:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Build aar with Gradle
      run: ./gradlew folioreader:assembleRelease
      
    - name: Generate Maven artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew folioreader:install
      
    - name: Upload Library AAR
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v3
      with:
        name: folioreader-aar
        path: folioreader/build/outputs/aar/*.aar 